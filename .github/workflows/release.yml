name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create icon
        run: |
          mkdir -p /tmp/icon.iconset
          sips -z 16 16     src/assets/icon.png --out /tmp/icon.iconset/icon_16x16.png
          sips -z 32 32     src/assets/icon.png --out /tmp/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     src/assets/icon.png --out /tmp/icon.iconset/icon_32x32.png
          sips -z 64 64     src/assets/icon.png --out /tmp/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   src/assets/icon.png --out /tmp/icon.iconset/icon_128x128.png
          sips -z 256 256   src/assets/icon.png --out /tmp/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   src/assets/icon.png --out /tmp/icon.iconset/icon_256x256.png
          sips -z 512 512   src/assets/icon.png --out /tmp/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   src/assets/icon.png --out /tmp/icon.iconset/icon_512x512.png
          cp src/assets/icon.png /tmp/icon.iconset/icon_512x512@2x.png
          iconutil -c icns /tmp/icon.iconset -o src/assets/icon.icns

      - name: Build macOS app
        run: |
          pyinstaller build_macos.spec --clean --noconfirm

      - name: Create archive
        run: |
          cd dist
          zip -ry SocialMediaDownloader-macOS-${{ github.ref_name }}.zip SocialMediaDownloader.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/SocialMediaDownloader-macOS-*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create Windows icon (if missing)
        run: |
          python -c "from PIL import Image; img = Image.open('src/assets/icon.png'); img.save('src/assets/icon.ico', format='ICO', sizes=[(16,16), (32,32), (48,48), (64,64), (128,128), (256,256)])"
        shell: bash

      - name: Build Windows executable
        run: |
          pyinstaller build_windows.spec --clean --noconfirm

      - name: Create archive
        run: |
          cd dist
          Compress-Archive -Path SocialMediaDownloader.exe -DestinationPath SocialMediaDownloader-Windows-${{ github.ref_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/SocialMediaDownloader-Windows-*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build Linux executable
        run: |
          pyinstaller build_linux.spec --clean --noconfirm

      - name: Create archive
        run: |
          cd dist
          tar -czf SocialMediaDownloader-Linux-${{ github.ref_name }}.tar.gz SocialMediaDownloader

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/SocialMediaDownloader-Linux-*.tar.gz

  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/macos-build/*.zip
            artifacts/windows-build/*.zip
            artifacts/linux-build/*.tar.gz
          body: |
            # 🎉 Social Media Downloader ${{ github.ref_name }}
            
            Download videos from YouTube and Instagram with a beautiful GUI!
            
            ## 📥 Downloads
            
            ### macOS
            - Download: `SocialMediaDownloader-macOS-${{ github.ref_name }}.zip`
            - Requirements: macOS 10.13+
            - Install FFmpeg: `brew install ffmpeg`
            
            ### Windows
            - Download: `SocialMediaDownloader-Windows-${{ github.ref_name }}.zip`
            - Requirements: Windows 10+
            - Install FFmpeg: See [guide](https://github.com/sainathd07/socialmedia-downloader/blob/main/FFMPEG_INSTALL.md)
            
            ### Linux
            - Download: `SocialMediaDownloader-Linux-${{ github.ref_name }}.tar.gz`
            - Requirements: Ubuntu 20.04+ or equivalent
            - Install FFmpeg: `sudo apt install ffmpeg`
            
            ## 📖 Documentation
            - [User Guide](https://github.com/sainathd07/socialmedia-downloader/blob/main/USER_GUIDE.md)
            - [Troubleshooting](https://github.com/sainathd07/socialmedia-downloader/blob/main/TROUBLESHOOTING.md)
            - [FFmpeg Installation](https://github.com/sainathd07/socialmedia-downloader/blob/main/FFMPEG_INSTALL.md)
            
            ## 🐛 Report Issues
            [Open an Issue](https://github.com/sainathd07/socialmedia-downloader/issues/new/choose)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
